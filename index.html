<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14171a">
<title>Home control</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#14171a;--panel:#1d2226;--line:#2b3238;--text:#e8ecef;--dim:#8b96a0;--amber:#f5b942;--ink:#2a1d00;color-scheme:dark}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{font-family:Outfit,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;max-width:480px;margin:auto;padding:max(20px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:18px}
header{display:flex;justify-content:space-between;align-items:center}
h1{font-size:22px;font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
#conn{font-size:14px;padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:var(--panel);color:var(--dim)}
#conn.ok{color:var(--amber);border-color:var(--amber)}
#list{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;justify-content:space-between;width:100%;padding:20px;border-radius:16px;background:var(--panel);border:1px solid var(--line);text-align:left;transition:background .2s,color .2s}
.row b{display:block;font-size:20px;font-weight:500}
.row small{font-size:13px;color:var(--dim)}
.row.on{background:var(--amber);border-color:var(--amber);color:var(--ink)}
.row.on small{color:var(--ink)}
.sw{flex:none;width:52px;height:30px;border-radius:15px;background:var(--line);position:relative}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--dim);transition:transform .2s}
.on .sw{background:var(--ink)}
.on .sw::after{transform:translateX(22px);background:var(--amber)}
footer{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:12px}
#mic{width:80px;height:80px;border-radius:50%;border:1px solid var(--amber);background:var(--panel);display:grid;place-items:center}
#mic.live{background:var(--amber);animation:p 1s infinite}
#mic svg{width:34px;height:34px;fill:none;stroke:var(--amber);stroke-width:2;stroke-linecap:round}
#mic.live svg{stroke:var(--ink)}
#heard{font-size:14px;color:var(--dim);min-height:20px;text-align:center}
#lang{font-size:13px;padding:6px 14px;border-radius:16px;border:1px solid var(--line);background:var(--panel);color:var(--dim)}
@keyframes p{50%{box-shadow:0 0 0 12px rgba(245,185,66,.18)}}
@media (prefers-reduced-motion:reduce){#mic.live{animation:none}}
</style>
</head>
<body>
<header><h1>Home control</h1><button id="conn">Tap to connect</button></header>
<div id="list"></div>
<footer>
  <button id="mic" aria-label="Speak a command"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  <div id="heard">Tap the mic and speak</div>
  <button id="lang" aria-label="Change voice language"></button>
</footer>
<script>
const NAMES=['Fan','Dim light','Socket','Tubelight'],ON='ABCD',OFF='abcd';
const SVC='6e400001-b5a3-f393-e0a9-e50e24dcca9e',RXC='6e400002-b5a3-f393-e0a9-e50e24dcca9e',TXC='6e400003-b5a3-f393-e0a9-e50e24dcca9e';
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rows=NAMES.map((n,i)=>{
  const b=document.createElement('button');
  b.className='row';b.setAttribute('role','switch');b.setAttribute('aria-checked','false');
  b.innerHTML='<span><b>'+n+'</b><small>Off</small></span><span class="sw"></span>';
  b.onclick=()=>send(b.getAttribute('aria-checked')==='true'?OFF[i]:ON[i]);
  $('#list').appendChild(b);return b;
});
function paint(s){rows.forEach((b,i)=>{const on=s[i]==='1';b.classList.toggle('on',on);b.setAttribute('aria-checked',on);b.querySelector('small').textContent=on?'On':'Off';});}
function say(t,ok){const c=$('#conn');c.textContent=t;c.classList.toggle('ok',!!ok);}

let dev,rx,tx,buf='',ready=false,busy=false;const dec=new TextDecoder();
function attach(d){dev=d;dev.addEventListener('gattserverdisconnected',()=>{ready=false;say('Reconnecting…');keepAlive();});}
async function link(){
  const g=await dev.gatt.connect(),sv=await g.getPrimaryService(SVC);
  rx=await sv.getCharacteristic(RXC);tx=await sv.getCharacteristic(TXC);
  await tx.startNotifications();tx.addEventListener('characteristicvaluechanged',onData);
  ready=true;say('Connected',true);send('S');
}
async function keepAlive(){
  if(busy)return;busy=true;
  while(!ready){
    try{await link();}catch(e){try{dev.gatt.disconnect();}catch(_){}await sleep(2500);}
  }
  busy=false;
}
async function send(t){
  if(!ready)return;
  try{await rx.writeValue(new TextEncoder().encode(t+'\n'));}catch(e){say('Send failed');}
}
function onData(e){
  buf+=dec.decode(e.target.value,{stream:true});let i;
  while((i=buf.indexOf('\n'))>=0){
    const l=buf.slice(0,i).trim();buf=buf.slice(i+1);
    if(l.startsWith('STATUS:'))paint(l.slice(7));else if(l)$('#heard').textContent=l;
  }
}
$('#conn').onclick=async()=>{
  if(ready)return;
  try{
    if(!dev)attach(await navigator.bluetooth.requestDevice({filters:[{services:[SVC]}]}));
    say('Connecting…');keepAlive();
  }catch(e){say('Tap to connect');}
};
(async()=>{
  if(!navigator.bluetooth){say('Open in Chrome');return;}
  try{
    const d=(await navigator.bluetooth.getDevices()).find(x=>x.name==='ESP32_HOME');
    if(d){attach(d);say('Connecting…');keepAlive();}
  }catch(e){}
})();

const SR=window.SpeechRecognition||window.webkitSpeechRecognition,mic=$('#mic'),heard=$('#heard'),lb=$('#lang');
const MSG={'not-allowed':'Mic blocked. Allow Microphone for this site in Chrome settings','service-not-allowed':'Open this page in the Chrome browser','network':'Voice needs internet. Turn on mobile data','no-speech':'Heard nothing. Tap the mic and try again','audio-capture':'No microphone found','language-not-supported':'This language is not supported here'};

const W={
  on:['on','chalu','chaalu','jalao','jala','chala','chalao','start','ऑन','आन','ओन','चालू','चालु','जला','जलाओ','चला','चलाओ','खोल'],
  off:['off','band','bandh','bujha','bujhao','stop','ऑफ','आफ','ओफ','बंद','बन्द','बुझा','बुझाओ'],
  all:['all','sab','sabhi','everything','सब','सभी','ऑल'],
  dev:[
    ['fan','pankha','panka','1','one','ek','फैन','फेन','पंखा','पंखे','एक'],
    ['light','lite','bulb','batti','dim','2','two','do','लाइट','लाईट','बल्ब','बत्ती','डिम','दो'],
    ['socket','plug','charger','3','three','teen','सॉकेट','सोकेट','प्लग','चार्जर','तीन'],
    ['tube','4','four','char','chaar','ट्यूब','टयूब','चार']
  ]
};
const norm=s=>s.toLowerCase().normalize('NFD').replace(/\u093c/g,'').normalize('NFC')
  .replace(/tube\s*light|ट्यूब\s*लाइट|टयूब\s*लाइट/g,'tube').replace(/[.,!?।]/g,' ');
function parse(raw){
  const t=norm(raw),tk=t.split(/\s+/);
  const has=l=>l.some(w=>/[a-z0-9]/.test(w)?tk.includes(w):t.includes(w));
  const on=has(W.on),off=has(W.off);
  if(on===off)return null;
  if(has(W.all))return[on?'E':'e'];
  const out=[];
  W.dev.forEach((l,i)=>{if(has(l))out.push((on?ON:OFF)[i]);});
  return out.length?out:null;
}

let r=null,lang='en-IN';
try{lang=localStorage.getItem('lang')||'en-IN';}catch(_){}
function showLang(){lb.textContent=lang==='hi-IN'?'Voice: Hindi':'Voice: English';}
showLang();
lb.onclick=()=>{
  lang=lang==='hi-IN'?'en-IN':'hi-IN';
  try{localStorage.setItem('lang',lang);}catch(_){}
  if(r)r.lang=lang;
  showLang();
};

if(!window.isSecureContext){mic.hidden=true;lb.hidden=true;heard.textContent='Open the https:// link, not a saved file';}
else if(!SR){mic.hidden=true;lb.hidden=true;heard.textContent='Voice needs Chrome';}
else{
  r=new SR();r.lang=lang;r.interimResults=false;r.maxAlternatives=5;
  r.onstart=()=>{mic.classList.add('live');heard.textContent='Listening…';};
  r.onend=()=>mic.classList.remove('live');
  r.onresult=async e=>{
    const alts=[...e.results[0]].map(a=>a.transcript);
    heard.textContent='Heard: '+alts[0];
    for(const a of alts){
      const cmds=parse(a);
      if(cmds){
        if(!ready){heard.textContent+=' (connect first)';return;}
        for(const c of cmds)await send(c);
        return;
      }
    }
    heard.textContent='Not understood: "'+alts[0]+'". Try "fan on" or "sab band"';
  };
  r.onerror=e=>{heard.textContent=MSG[e.error]||('Mic error: '+e.error);};
  mic.onclick=()=>{try{r.start();}catch(_){r.stop();}};
}
</script>
</body>
</html>
