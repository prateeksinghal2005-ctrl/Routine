<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>ESP Home</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b14;--card:#1c2533;--line:#2a3548;--text:#e8edf5;--dim:#6f7b8e;color-scheme:dark}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{font-family:Outfit,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;max-width:520px;margin:auto;padding:max(16px,env(safe-area-inset-top)) 14px max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
header{text-align:center}
h1{font-size:22px;font-weight:600;letter-spacing:.5px}
header p{font-size:15px;color:#22c55e;margin-top:2px}
#grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{--c:#fff;text-align:left;padding:18px;border-radius:20px;background:var(--card);border:1px solid transparent;transition:background .25s,box-shadow .25s,border-color .25s}
.tile svg{width:32px;height:32px;fill:none;stroke:var(--c);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:filter .25s}
.tile b{display:block;margin-top:14px;font-size:17px;font-weight:600}
.tile .st{display:block;margin-top:8px;font-size:20px;font-weight:500;color:var(--dim)}
.tile.on{background:color-mix(in srgb,var(--c) 16%,var(--card));border-color:var(--c);box-shadow:0 0 26px color-mix(in srgb,var(--c) 50%,transparent),inset 0 0 20px color-mix(in srgb,var(--c) 14%,transparent)}
.tile.on svg{filter:drop-shadow(0 0 7px var(--c))}
.tile.on .st{color:var(--c)}
.tile.on .glow{fill:var(--c);fill-opacity:.4}
.tile.on .spin{animation:spin .6s linear infinite}
.spin{transform-box:fill-box;transform-origin:center}
#study{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-radius:16px;background:var(--card);border:1px solid transparent;font-size:16px;font-weight:500;transition:.25s}
#study small{display:block;font-size:13px;color:var(--dim);font-weight:400}
#study.on{border-color:#f59e0b;background:color-mix(in srgb,#f59e0b 14%,var(--card));box-shadow:0 0 22px rgba(245,158,11,.35)}
.sw{flex:none;width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:.25s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--dim);transition:.25s}
.on>.sw{background:#f59e0b}
.on>.sw::after{transform:translateX(20px);background:#fff}
#voice{position:relative;text-align:center;padding:20px 16px 16px;border-radius:20px;background:#16224d;border:1px solid #243574;cursor:pointer}
#voice svg.m{width:30px;height:30px;fill:none;stroke:#9cc3ff;stroke-width:1.8;stroke-linecap:round}
#voice.live svg.m{animation:pulse 1.2s infinite}
#voice b{display:block;margin-top:8px;font-size:15px;font-weight:600}
#state{margin-top:6px;font-size:21px;font-weight:600;color:#9cc3ff}
#heard{margin-top:6px;font-size:14px;color:#c9d6f2;min-height:20px}
#voice.off{background:var(--card);border-color:var(--line)}
#voice.off #state,#voice.off svg.m{color:var(--dim);stroke:var(--dim)}
#x{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center}
#x svg{width:16px;height:16px;stroke:#fff;stroke-width:2.4;stroke-linecap:round}
#lang{position:absolute;top:10px;left:10px;font-size:12px;padding:6px 10px;border-radius:14px;background:rgba(255,255,255,.1)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two button{padding:18px;border-radius:16px;font-size:18px;font-weight:600}
#allon{background:#17673a}#alloff{background:#9a1b1b}
#conn{display:flex;justify-content:center;align-items:center;gap:8px;font-size:15px;color:#f59e0b;padding:4px}
#conn.ok{color:#22c55e}
#conn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.tile.on .spin,#voice.live svg.m{animation:none}}
</style>
</head>
<body>
<header><h1>ESP HOME</h1><p>Home Automation Dashboard</p></header>
<div id="grid"></div>
<button id="study" aria-pressed="false"><span>Study mode<small>Turns the tubelight on</small></span><span class="sw"></span></button>
<section id="voice" class="off">
  <button id="lang"></button>
  <button id="x" aria-label="Turn mic off"><svg viewBox="0 0 16 16"><path d="M3 3l10 10M13 3L3 13"/></svg></button>
  <svg class="m" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
  <b>VOICE ASSISTANT</b>
  <div id="state">Mic is off</div>
  <div id="heard">Tap to turn on</div>
</section>
<div class="two"><button id="allon">ALL ON</button><button id="alloff">ALL OFF</button></div>
<div id="conn"><svg viewBox="0 0 24 24"><path d="M7 7l10 10-5 5V2l5 5L7 17"/></svg><span id="ctext">Tap anywhere to connect</span></div>
<script>
const SVC='6e400001-b5a3-f393-e0a9-e50e24dcca9e',RXC='6e400002-b5a3-f393-e0a9-e50e24dcca9e',TXC='6e400003-b5a3-f393-e0a9-e50e24dcca9e';
const ON='ABCD',OFF='abcd';
const STUDY=[3]; /* relays that turn on in study mode: 0=Fan 1=Dim light 2=Socket 3=Tubelight */
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const BLADE='<path d="M12 11C10.5 6 11 3 13.5 3S16.5 6.5 12 11z"/>';
const TILES=[
 ['Fan','#5aa2ff','<g class="spin">'+BLADE+BLADE.replace('<path','<path transform="rotate(90 12 12)"')+BLADE.replace('<path','<path transform="rotate(180 12 12)"')+BLADE.replace('<path','<path transform="rotate(270 12 12)"')+'</g><circle cx="12" cy="12" r="1.3"/>'],
 ['Dim light','#f5b942','<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>'],
 ['Socket','#2ed3a0','<path d="M9 3v5M15 3v5M7 8h10v3a5 5 0 0 1-10 0zM12 16v5"/>'],
 ['Tubelight','#c08bf7','<rect class="glow" x="2" y="9" width="20" height="6" rx="3"/><path d="M6 12h12"/>']
];
let st=[0,0,0,0],studyOn=false;
const tiles=TILES.map((t,i)=>{
  const b=document.createElement('button');
  b.className='tile';b.style.setProperty('--c',t[1]);b.setAttribute('aria-pressed','false');
  b.innerHTML='<svg viewBox="0 0 24 24">'+t[2]+'</svg><b>'+t[0]+'</b><span class="st">OFF</span>';
  b.onclick=()=>send(st[i]?OFF[i]:ON[i]);
  $('#grid').appendChild(b);return b;
});
function paint(s){
  st=[0,1,2,3].map(i=>s[i]==='1'?1:0);
  tiles.forEach((b,i)=>{b.classList.toggle('on',!!st[i]);b.setAttribute('aria-pressed',!!st[i]);b.querySelector('.st').textContent=st[i]?'ON':'OFF';});
  if(!STUDY.every(i=>st[i]))studyOn=false;
  $('#study').classList.toggle('on',studyOn);$('#study').setAttribute('aria-pressed',studyOn);
}
async function setStudy(on){
  studyOn=on;
  for(const i of STUDY)await send((on?ON:OFF)[i]);
  paint(st.join(''));
}
$('#study').onclick=()=>setStudy(!studyOn);
$('#allon').onclick=()=>send('E');$('#alloff').onclick=()=>send('e');

function say(t,ok){$('#ctext').textContent=t;$('#conn').classList.toggle('ok',!!ok);$('header p').style.color=ok?'#22c55e':'#f59e0b';}
let dev,rx,tx,buf='',ready=false,busy=false,picking=false;const dec=new TextDecoder();
function attach(d){dev=d;dev.addEventListener('gattserverdisconnected',()=>{ready=false;say('Reconnecting…');keepAlive();});}
async function link(){
  const g=await dev.gatt.connect(),sv=await g.getPrimaryService(SVC);
  rx=await sv.getCharacteristic(RXC);tx=await sv.getCharacteristic(TXC);
  await tx.startNotifications();tx.addEventListener('characteristicvaluechanged',onData);
  ready=true;say('ESP32 Connected',true);send('S');
}
async function keepAlive(){
  if(busy)return;busy=true;
  while(!ready){try{await link();}catch(e){try{dev.gatt.disconnect();}catch(_){}await sleep(2500);}}
  busy=false;
}
async function send(t){
  if(!ready)return;
  try{await rx.writeValue(new TextEncoder().encode(t+'\n'));}catch(e){say('Send failed');}
}
function onData(e){
  buf+=dec.decode(e.target.value,{stream:true});let i;
  while((i=buf.indexOf('\n'))>=0){const l=buf.slice(0,i).trim();buf=buf.slice(i+1);if(l.startsWith('STATUS:'))paint(l.slice(7));}
}
async function connectFlow(){
  if(ready||busy||picking||!navigator.bluetooth)return;
  try{
    if(!dev){picking=true;attach(await navigator.bluetooth.requestDevice({filters:[{services:[SVC]}]}));picking=false;}
    say('Connecting…');keepAlive();
  }catch(e){picking=false;say('Tap anywhere to connect');}
}
if(!navigator.bluetooth)say('Open in Chrome (Android)');
else (async()=>{
  try{
    const d=(await navigator.bluetooth.getDevices()).find(x=>x.name==='ESP32_HOME');
    if(d){attach(d);say('Connecting…');keepAlive();}
  }catch(e){}
})();

const W={
  on:['on','chalu','chaalu','jalao','jala','chala','chalao','start','ऑन','आन','ओन','चालू','चालु','जला','जलाओ','चला','चलाओ','खोल'],
  off:['off','band','bandh','bujha','bujhao','stop','ऑफ','आफ','ओफ','बंद','बन्द','बुझा','बुझाओ'],
  all:['all','sab','sabhi','everything','सब','सभी','ऑल'],
  study:['study','padhai','padai','स्टडी','पढाई'],
  dev:[
    ['fan','pankha','panka','1','one','ek','फैन','फेन','पंखा','पंखे','एक'],
    ['light','lite','bulb','batti','dim','2','two','do','लाइट','लाईट','बल्ब','बत्ती','डिम','दो'],
    ['socket','plug','charger','3','three','teen','सॉकेट','सोकेट','प्लग','चार्जर','तीन'],
    ['tube','4','four','char','chaar','ट्यूब','टयूब','चार']
  ]
};
const norm=s=>s.toLowerCase().normalize('NFD').replace(/\u093c/g,'').normalize('NFC')
  .replace(/tube\s*light|ट्यूब\s*लाइट|टयूब\s*लाइट/g,'tube').replace(/[.,!?।]/g,' ');
function parse(raw){
  const t=norm(raw),tk=t.split(/\s+/);
  const has=l=>l.some(w=>/[a-z0-9]/.test(w)?tk.includes(w):t.includes(w));
  const on=has(W.on),off=has(W.off);
  if(on===off)return null;
  if(has(W.study))return[on?'@s1':'@s0'];
  if(has(W.all))return[on?'E':'e'];
  const out=[];
  W.dev.forEach((l,i)=>{if(has(l))out.push((on?ON:OFF)[i]);});
  return out.length?out:null;
}
async function run(c){if(c==='@s1')await setStudy(true);else if(c==='@s0')await setStudy(false);else await send(c);}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition,voice=$('#voice'),heard=$('#heard'),state=$('#state'),lb=$('#lang');
const FATAL={'not-allowed':'Mic blocked. Allow Microphone for this site in Chrome settings','service-not-allowed':'Open this page in the Chrome browser','network':'Voice needs internet. Turn on mobile data','audio-capture':'No microphone found','language-not-supported':'This language is not supported'};
let rec=null,micOn=true,listening=false,lang='en-IN';
try{lang=localStorage.getItem('lang')||'en-IN';}catch(_){}
const showLang=()=>{lb.textContent=lang==='hi-IN'?'हिंदी':'English';};showLang();
function paintMic(){
  voice.classList.toggle('off',!micOn);voice.classList.toggle('live',micOn&&listening);
  $('#x').hidden=lb.hidden=!micOn;
  state.textContent=!micOn?'Mic is off':(listening?"Hey! I'm listening":'Starting mic…');
}
function startMic(){if(!rec||!micOn||listening)return;try{rec.start();}catch(_){}}
function stopMic(){micOn=false;listening=false;if(rec)try{rec.abort();}catch(_){}paintMic();heard.textContent='Tap to turn on';}

if(!window.isSecureContext||!SR){
  micOn=false;paintMic();voice.style.display='none';
  say(!SR?'Voice needs Chrome':'Open the https:// link');
}else{
  rec=new SR();rec.lang=lang;rec.interimResults=false;rec.maxAlternatives=5;
  rec.onstart=()=>{listening=true;paintMic();if(!/Heard|Not understood/.test(heard.textContent))heard.textContent='Say: "fan on" or "study mode on"';};
  rec.onend=()=>{listening=false;paintMic();if(micOn)setTimeout(startMic,350);};
  rec.onresult=async e=>{
    const alts=[...e.results[e.results.length-1]].map(a=>a.transcript);
    heard.textContent='Heard: '+alts[0];
    for(const a of alts){
      const cmds=parse(a);
      if(cmds){
        if(!ready){heard.textContent+=' (not connected)';return;}
        for(const c of cmds)await run(c);
        return;
      }
    }
    heard.textContent='Not understood: "'+alts[0]+'"';
  };
  rec.onerror=e=>{
    if(FATAL[e.error]){stopMic();heard.textContent=FATAL[e.error];}
  };
  $('#x').onclick=ev=>{ev.stopPropagation();stopMic();};
  lb.onclick=ev=>{
    ev.stopPropagation();lang=lang==='hi-IN'?'en-IN':'hi-IN';
    try{localStorage.setItem('lang',lang);}catch(_){}
    showLang();rec.lang=lang;try{rec.abort();}catch(_){}
  };
  voice.onclick=()=>{if(!micOn){micOn=true;heard.textContent='Starting…';paintMic();startMic();}};
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){try{rec.abort();}catch(_){}}else startMic();
  });
  paintMic();startMic();
}
document.addEventListener('click',()=>{connectFlow();startMic();},true);
</script>
</body>
</html>
